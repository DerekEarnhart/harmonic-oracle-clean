version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: harmonic-oracle-vllm
    ports:
      - "8000:8000"
    environment:
      # Model configuration
      - MODEL_NAME=meta-llama/Llama-3.3-70B-Instruct
      # For testing with smaller model, use:
      # - MODEL_NAME=meta-llama/Llama-3.1-8B-Instruct
      
      # GPU configuration
      - TENSOR_PARALLEL_SIZE=2  # Number of GPUs to use
      - GPU_MEMORY_UTILIZATION=0.95
      
      # Context length
      - MAX_MODEL_LEN=32768
      
      # Performance tuning
      - MAX_NUM_SEQS=256
      - ENABLE_CHUNKED_PREFILL=true
      
      # Security (optional)
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      
      # HuggingFace token (required for gated models)
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    
    volumes:
      # Cache downloaded models
      - vllm-models:/root/.cache/huggingface
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2  # Number of GPUs
              capabilities: [gpu]
    
    command: >
      --model ${MODEL_NAME:-meta-llama/Llama-3.3-70B-Instruct}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-2}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.95}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --max-num-seqs ${MAX_NUM_SEQS:-256}
      --host 0.0.0.0
      --port 8000
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Model loading takes time

volumes:
  vllm-models:
    driver: local

